name: Build
on:
  workflow_dispatch:
  pull_request:
  workflow_call:

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  verify-wheels:
    name: Verify wheels (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: [build-wheels]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-${{ matrix.os }}
          path: wheels
          merge-multiple: true

      - name: Install wheel
        shell: bash
        run: pip install --only-binary iscc_core --find-links wheels iscc_core

      - name: Verify turbo mode is active
        run: python -c "import iscc_core; assert iscc_core.turbo(), 'Turbo mode not active'"

      - name: Run conformance selftest
        run: python -c "import iscc_core; assert iscc_core.conformance_selftest(), 'Conformance selftest failed'"

  verify-sdist:
    name: Verify sdist
    needs: [build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Install sdist
        run: pip install dist/*.tar.gz

      - name: Verify pure-Python mode
        run: python -c "import iscc_core; assert not iscc_core.turbo(), 'Expected pure-Python mode'"

      - name: Run conformance selftest
        run: python -c "import iscc_core; assert iscc_core.conformance_selftest(), 'Conformance selftest failed'"
